<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTUT SSO+ 跨裝置掃碼登入</title>
    <meta name="description" content="使用 NTUT SSO+ 擴充功能進行端到端加密掃碼登入">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Light Theme (Premium Modern Blue & Teal) */
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.12);
            --bg-main: #f1f5f9;
            --bg-sub: #ffffff;
            --text-main: #0f172a;
            --text-sub: #334155;
            --text-muted: #64748b;
            --border: rgba(15, 23, 42, 0.12);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;

            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark Theme (GitHub Dark) */
                --primary: #58a6ff;
                --primary-glow: rgba(88, 166, 255, 0.15);
                --bg-main: #0d1117;
                --bg-sub: #161b22;
                --text-main: #c9d1d9;
                --text-sub: #8b949e;
                --text-muted: #6e7681;
                --border: #30363d;
                --success: #238636;
                --error: #f85149;
                --warning: #d29922;
            }
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Hide particles from old design */
        .particles {
            display: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        .card {
            background: var(--bg-sub);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* QR Code container */
        .qr-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .qr-container {
            position: relative;
            padding: 16px;
            background: #ffffff;
            /* QR code must always have white bg for scanning */
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .qr-container.active {
            box-shadow: 0 0 0 4px var(--primary-glow);
            border-color: var(--primary);
        }

        .qr-container.expired {
            filter: grayscale(1) opacity(0.4);
        }

        .qr-container.success {
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
            border-color: var(--success);
        }

        @media (prefers-color-scheme: dark) {
            .qr-container.success {
                box-shadow: 0 0 0 4px rgba(35, 134, 54, 0.2);
            }
        }

        #qrcode {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Let qrcode.js handle the display property of img/canvas naturally to avoid double rendering */

        /* Timer section */
        .timer-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .timer-ring {
            position: relative;
            width: 40px;
            height: 40px;
        }

        .timer-ring svg {
            transform: rotate(-90deg);
        }

        .timer-ring-bg {
            stroke: var(--border);
        }

        .timer-ring-progress {
            stroke: var(--primary);
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }

        .timer-ring-progress.warning {
            stroke: var(--warning);
        }

        .timer-ring-progress.critical {
            stroke: var(--error);
        }

        .timer-text {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .timer-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Status indicator */
        .status-bar {
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--text-muted);
        }

        .status-dot.polling {
            background: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .status-dot.success {
            background: var(--success);
        }

        .status-dot.error {
            background: var(--error);
        }

        .status-text {
            font-size: 0.82rem;
            color: var(--text-sub);
        }

        .status-text strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Regenerate button */
        .regen-btn {
            display: none;
            width: 100%;
            padding: 10px;
            background: var(--primary);
            border: 1px solid var(--primary);
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }

        @media (prefers-color-scheme: dark) {
            .regen-btn {
                color: #ffffff;
                /* ensure white text on primary in dark mode */
            }
        }

        .regen-btn:hover {
            opacity: 0.9;
        }

        .regen-btn.visible {
            display: block;
        }

        /* Debug section */
        .debug-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 0 0;
            border-top: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }

        .debug-toggle span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .debug-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .debug-content.open {
            max-height: 200px;
        }

        .code-block {
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-sub);
            word-break: break-all;
            margin-top: 12px;
        }

        .code-block .key-label {
            color: var(--text-main);
            font-weight: 600;
        }

        .code-block .val {
            color: var(--primary);
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-sub);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .copy-btn:hover {
            background: var(--bg-main);
            color: var(--text-main);
        }

        /* Security badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
        }

        .security-badge span {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Success overlay */
        .success-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: var(--bg-sub);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .success-overlay.visible {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .success-check {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--success);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .success-text {
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .success-subtext {
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="card">
            <!-- Success overlay -->
            <div class="success-overlay" id="successOverlay">
                <div class="success-check">✓</div>
                <div class="success-text">授權成功</div>
                <div class="success-subtext">正在安全跳轉中...</div>
            </div>

            <!-- Header -->
            <div class="header">
                <div class="header-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        <path d="M12 8v4" />
                        <path d="M12 16h.01" />
                    </svg>
                </div>
                <h1>NTUT SSO+</h1>
                <p class="subtitle">請在手機打開擴充功能以掃碼登入</p>
            </div>

            <!-- QR Code -->
            <div class="qr-wrapper">
                <div class="qr-container active" id="qrContainer">
                    <div id="qrcode"></div>
                </div>
            </div>

            <!-- Timer -->
            <div class="timer-section" id="timerSection">
                <div class="timer-ring">
                    <svg width="40" height="40" viewBox="0 0 40 40">
                        <circle class="timer-ring-bg" cx="20" cy="20" r="17" fill="none" stroke-width="3" />
                        <circle class="timer-ring-progress" id="timerProgress" cx="20" cy="20" r="17" fill="none"
                            stroke-width="3" stroke-linecap="round" stroke-dasharray="106.81" stroke-dashoffset="0" />
                    </svg>
                </div>
                <div>
                    <div class="timer-text" id="timerText">5:00</div>
                    <div class="timer-label">工作階段剩餘時間</div>
                </div>
            </div>

            <!-- Status -->
            <div class="status-bar" id="statusBar">
                <div class="status-dot polling" id="statusDot"></div>
                <div class="status-text" id="statusText">
                    <strong>等待掃碼中</strong> — 每 2 秒安全檢查一次
                </div>
            </div>

            <!-- Regenerate button (hidden by default) -->
            <button class="regen-btn" id="regenBtn" onclick="regenerateSession()">🔄 重新產生 QR Code</button>

            <!-- Debug section -->
            <div class="debug-toggle" id="debugToggle" onclick="toggleDebug()">
                <span>🔧 偵錯資訊</span>
                <span class="chevron">▼</span>
            </div>
            <div class="debug-content" id="debugContent">
                <div class="code-block" id="debugJson">載入中...</div>
                <button class="copy-btn" id="copyBtn" onclick="copyJson()">
                    📋 複製 JSON（測試用）
                </button>
            </div>

            <!-- Security badge -->
            <div class="security-badge">
                <span class="lock-icon">🔒</span>
                <span>AES-256-GCM 端到端加密 · 閱後即焚</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Configuration
        // ============================================================
        const API_BASE_URL = '/api/session';
        const SESSION_TTL_SECONDS = 300; // 5 minutes
        const POLL_INTERVAL_MS = 2000;

        // ============================================================
        // Cryptographic Utilities (secure)
        // ============================================================

        /**
         * Generate a 256-bit (32-byte) cryptographically secure key.
         * Returns Base64-encoded string (44 characters).
         */
        function generateSecretKey() {
            const keyBytes = new Uint8Array(32);
            crypto.getRandomValues(keyBytes);
            return uint8ToBase64(keyBytes);
        }

        /**
         * Convert Uint8Array to Base64 string.
         */
        function uint8ToBase64(bytes) {
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        /**
         * Convert Base64 string to Uint8Array.
         */
        function base64ToUint8(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        /**
         * AES-256-GCM Decryption using Web Crypto API.
         * Input format: "base64(IV):base64(ciphertext_with_tag)"
         * Key format: Base64-encoded 32-byte key
         */
        async function aesDecryptGCM(encryptedPayload, base64Key) {
            const parts = encryptedPayload.split(':');
            if (parts.length !== 2) {
                throw new Error('密文格式無效：缺少 IV 分隔符');
            }

            const ivBytes = base64ToUint8(parts[0]);
            const cipherBytes = base64ToUint8(parts[1]);
            const keyBytes = base64ToUint8(base64Key);

            const cryptoKey = await crypto.subtle.importKey(
                'raw',
                keyBytes,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );

            try {
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: ivBytes },
                    cryptoKey,
                    cipherBytes
                );
                return new TextDecoder().decode(decryptedBuffer);
            } catch (e) {
                throw new Error('解密失敗：密鑰不符或資料被竄改');
            }
        }

        // ============================================================
        // Session State
        // ============================================================
        let sessionId = '';
        let secretKey = '';
        let qrContent = '';
        let pollTimer = null;
        let countdownTimer = null;
        let remainingSeconds = SESSION_TTL_SECONDS;
        let qrInstance = null;

        // ============================================================
        // DOM Elements
        // ============================================================
        const qrContainer = document.getElementById('qrContainer');
        const qrCodeEl = document.getElementById('qrcode');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const timerText = document.getElementById('timerText');
        const timerProgress = document.getElementById('timerProgress');
        const debugJson = document.getElementById('debugJson');
        const regenBtn = document.getElementById('regenBtn');
        const successOverlay = document.getElementById('successOverlay');

        // ============================================================
        // Initialize Session
        // ============================================================
        function initSession() {
            // Clean up previous session
            if (pollTimer) clearInterval(pollTimer);
            if (countdownTimer) clearInterval(countdownTimer);

            // Generate cryptographically secure credentials
            sessionId = crypto.randomUUID();
            secretKey = generateSecretKey();
            qrContent = JSON.stringify({ id: sessionId, key: secretKey });

            // Reset UI state
            remainingSeconds = SESSION_TTL_SECONDS;
            qrContainer.className = 'qr-container active';
            regenBtn.classList.remove('visible');
            successOverlay.classList.remove('visible');

            // Render QR Code
            qrCodeEl.innerHTML = '';
            qrInstance = new QRCode(qrCodeEl, {
                text: qrContent,
                width: 200,
                height: 200,
                colorDark: '#0a0a0f',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });

            // Update debug display (mask the key for safety)
            const maskedKey = secretKey.substring(0, 6) + '••••••••' + secretKey.substring(secretKey.length - 4);
            debugJson.innerHTML =
                '<span class="key-label">"id"</span>: <span class="val">"' + sessionId.substring(0, 8) + '..."</span>\n' +
                '<span class="key-label">"key"</span>: <span class="val">"' + maskedKey + '"</span>\n' +
                '<span class="key-label">"key_bits"</span>: <span class="val">256 (AES-GCM)</span>';

            // Update status
            setStatus('polling', '<strong>等待掃碼中</strong> — 每 2 秒安全檢查一次');

            // Start countdown & polling
            startCountdown();
            startPolling();
        }

        // ============================================================
        // Countdown Timer
        // ============================================================
        function startCountdown() {
            const circumference = 2 * Math.PI * 17; // r=17
            updateTimerDisplay();

            countdownTimer = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();

                if (remainingSeconds <= 0) {
                    expireSession();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            timerText.textContent = minutes + ':' + String(seconds).padStart(2, '0');

            // Update ring progress
            const circumference = 2 * Math.PI * 17;
            const progress = 1 - (remainingSeconds / SESSION_TTL_SECONDS);
            timerProgress.style.strokeDashoffset = circumference * progress;

            // Color transitions
            timerProgress.classList.remove('warning', 'critical');
            if (remainingSeconds <= 30) {
                timerProgress.classList.add('critical');
            } else if (remainingSeconds <= 60) {
                timerProgress.classList.add('warning');
            }
        }

        // ============================================================
        // Session Expiry
        // ============================================================
        function expireSession() {
            clearInterval(pollTimer);
            clearInterval(countdownTimer);
            pollTimer = null;
            countdownTimer = null;

            qrContainer.classList.add('expired');
            qrContainer.classList.remove('active');
            setStatus('expired', '<strong>已逾時</strong> — QR Code 已過期，請重新產生');
            regenBtn.classList.add('visible');
        }

        // ============================================================
        // Regenerate Session
        // ============================================================
        function regenerateSession() {
            initSession();
        }

        // ============================================================
        // HTTP Polling (No SDK, No WebSocket)
        // ============================================================
        function startPolling() {
            pollTimer = setInterval(async () => {
                try {
                    const url = `${API_BASE_URL}/${sessionId}`;
                    const res = await fetch(url);

                    if (!res.ok) return; // silently retry on next tick

                    const data = await res.json();

                    if (data && data.payload) {
                        // === Received encrypted payload ===
                        clearInterval(pollTimer);
                        clearInterval(countdownTimer);
                        pollTimer = null;
                        countdownTimer = null;

                        setStatus('success', '<strong>收到授權！</strong> 正在解密並執行閱後即焚...');

                        // 1. Burn-after-reading: DELETE the Firebase node immediately
                        try {
                            await fetch(url, { method: 'DELETE' });
                        } catch (_) {
                            // Best-effort deletion; continue regardless
                        }

                        // 2. AES-256-GCM Decryption (AEAD ensures integrity)
                        const ssoUrl = await aesDecryptGCM(data.payload, secretKey);

                        // 3. Clear sensitive data from memory
                        secretKey = '';
                        qrContent = '';

                        // 4. Show success animation
                        qrContainer.classList.remove('active');
                        qrContainer.classList.add('success');
                        successOverlay.classList.add('visible');

                        // 5. Redirect after brief animation
                        setTimeout(() => {
                            window.location.href = ssoUrl;
                        }, 1500);
                    }
                } catch (_) {
                    // Network error or parse error — silently retry on next tick
                    // ⚠️ SECURITY: Never log error details that might contain sensitive data
                }
            }, POLL_INTERVAL_MS);
        }

        // ============================================================
        // UI Helpers
        // ============================================================
        function setStatus(type, html) {
            statusDot.className = 'status-dot ' + type;
            statusText.innerHTML = html;
        }

        function toggleDebug() {
            const toggle = document.getElementById('debugToggle');
            const content = document.getElementById('debugContent');
            toggle.classList.toggle('open');
            content.classList.toggle('open');
        }

        function copyJson() {
            if (!qrContent) return;
            navigator.clipboard.writeText(qrContent).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerHTML = '✅ 已複製';
                setTimeout(() => { btn.innerHTML = '📋 複製 JSON（測試用）'; }, 2000);
            });
        }

        // ============================================================
        // Floating Particles Generator
        // ============================================================
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.width = (1 + Math.random() * 2) + 'px';
                p.style.height = p.style.width;
                if (Math.random() > 0.5) {
                    p.style.background = 'rgba(139, 92, 246, 0.25)';
                }
                container.appendChild(p);
            }
        }

        // ============================================================
        // Boot
        // ============================================================
        createParticles();
        initSession();
    </script>
</body>

</html>
